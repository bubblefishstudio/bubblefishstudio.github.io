<section class="hero" aria-label="Studio introduction">
	<video
		class="hero-media"
		autoplay
		muted
		loop
		playsinline
		poster="{{ include.poster | default: '/assets/video/hero-poster.webp' | relative_url }}"
	>
		<source src="{{ include.src | default: '/assets/video/hero.webm' | relative_url }}" type="video/webm">
	</video>
	<div class="hero-overlay">
		<p class="hero-line">{{ include.line | default: site.tagline }}</p>
	</div>
</section>
