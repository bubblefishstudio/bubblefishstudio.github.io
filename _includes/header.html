<nav class="main-bar navbar navbar-expand">
	<div class="brand navbar-brand">
		<a class="nav-link" href="/">
			<svg class="brand-logo" viewBox="0 0 290 350" version="1.1" xmlns="http://www.w3.org/2000/svg">
				<rect width="270" height="60" x="10" y="10"/>
				<rect width="60" height="240" x="190" y="100"/>
				<circle cx="95" cy="165" r="55"/>
			</svg>
			<span class="brand-name">{{site.title}}</span>
		</a>
	</div>
	<div class="navbar-nav">
		{% assign pages = site.collections | where: "label", "pages" | first %}
		{% for section in pages.docs %}
			<a class="nav-link {% if section.url == page.url %}active{% endif %}" href="{{section.url}}" {% if section.external %}target="_blank"{% endif %}>
				<span class="fa-fw {{section.nav-icon}}"></span>
				{{section.title}}
			</a>
		{% endfor %}

		{% for link in site.data.navlinks %}
			<a class="nav-link {% if link.url == page.url %}active{% endif %}" href="{{link.url}}" {% if link.external %}target="_blank"{% endif %}>
				<span class="fa-fw {{link.icon}}"></span>
				{{link.name}}
			</a>
		{% endfor %}
	</div>
</nav>
