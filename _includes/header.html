<header class="site-header">
	<a class="skip-link" href="#main">Skip to content</a>
	<a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}">
		<svg class="brand-mark" viewBox="0 0 290 350" aria-hidden="true">
			<rect width="270" height="60" x="10" y="10"/>
			<rect width="60" height="240" x="190" y="100"/>
			<circle cx="95" cy="165" r="55"/>
		</svg>
	</a>
	<nav class="site-nav" aria-label="Main">
		{% for item in site.data.nav %}
		<a
			href="{{ item.url }}"
			{% if item.cta %}class="nav-cta"{% endif %}
			{% if page.url == item.url %}aria-current="page"{% endif %}
		>{{ item.title }}</a>
		{% endfor %}
	</nav>
</header>
