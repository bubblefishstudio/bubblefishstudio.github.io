- name: Yilin
  role: Sound artist
  photo:
  bio: >-
    Why do I want to make art? Because I want to resonate with people, and I want
    the work to be felt. I explore the world with a desire to create, and I infuse
    what I see, hear and feel into sound.
- name: Matteo
  role: Sound artist
  photo:
  bio: >-
    I grew up by the seaside and have been making music since I was ten — both to
    share feeling in a common language, and to play with what sound can become.
    Computer science and music engineering are how those two instincts meet.
