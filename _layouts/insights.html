---
layout: default
---
<article class="page insights-page">
	<header class="page-header">
		<h1>{{ page.title }}</h1>
	</header>
	<ul class="insights-list">
		{% assign posts = site.insights | sort: "date" | reverse %}
		{% for post in posts %}
		<li>
			<a href="{{ post.url }}">
				<h2>{{ post.title }}</h2>
				<p>
					{% if post.author %}<span>{{ post.author }}</span>{% endif %}
					<time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: "%Y/%m/%d" }}</time>
				</p>
			</a>
		</li>
		{% endfor %}
	</ul>
</article>
