---
layout: default
---
<article class="page post-page">
	<header class="page-header">
		<p class="project-meta">
			{% if page.author %}<span>{{ page.author }}</span>{% endif %}
			<time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%Y/%m/%d" }}</time>
		</p>
		<h1>{{ page.title }}</h1>
	</header>
	<div class="post-content">
		{{ content }}
	</div>
</article>
