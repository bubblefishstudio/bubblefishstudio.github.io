{% capture main %}
<main class="main-content">
	<article class="insight-post">
		<h1>{{ page.title }}</h1>
		{{ content }}
		<time datetime="{{ page.date | date: '%F' }}" class="insight-date">{{ page.date | date_to_long_string }}</time>
	</article>
</main>
{% endcapture %}

{% include layout1.html main=main lang=page.lang %}
