title: BubbleFishStudio
baseurl: ""
url: "https://bubblefish.studio"
repository: "bubblefishstudio/bubblefishstudio.github.io"
sass.style: compressed
future: true

collections:
  works:
    output: true
  pages:
    output: true
  insights:
    output: true

defaults:
  - # english versions (default)
    scope:
      path: ""
    values:
      layout: "default"
      lang: "en"

  -
    scope:
      type: "pages"
      path: "_pages/*"
    values:
      permalink: ":path"
  - # italian pages
    scope:
      type: "pages"
      path: "_pages/it/*"
    values:
      lang: "it"

  -
    scope:
      type: "works"
    values:
      layout: "project"
      permalink: "/en/:collection/:name"
  - # italian projects
    scope:
      type: "works"
      path: "_works/it/*"
    values:
      permalink: "/it/:collection/:name"
      lang: "it"

  -
    scope:
      type: "insights"
    values:
      layout: "post"
      permalink: "/en/:year/:month/:day/:name"
  - # italian insights
    scope:
      type: "insights"
      path: "_insights/it/*"
    values:
      permalink: "/it/:year/:month/:day/:name"
      lang: "it"
