title: BubbleFishStudio
baseurl: ""
url: "https://bubblefish.studio"
repository: "bubblefishstudio/bubblefishstudio.github.io"
sass.style: compressed
future: true

collections:
  works:
    output: true
  pages:
    output: true

defaults:
  -
    scope:
      path: "_works/*/*.md"
      type: "works"
    values:
      permalink: ":collection/:name/"
      layout: "project"
  -
    scope:
      path: "_pages/en/*"
      type: "pages"
    values:
      lang: "en"
  -
    scope:
      path: "_pages/it/*"
      type: "pages"
    values:
      lang: "it"
  -
    scope:
      path: "_pages/*"
      type: "pages"
    values:
      permalink: ":path"
      layout: "page"
