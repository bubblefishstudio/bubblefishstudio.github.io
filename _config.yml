title: BubbleFishStudio
locale: en_US
baseurl: ""
url: "https://bubblefish.studio"
sass.style: compressed
future: true

collections:
  works:
    output: true
  pages:
    output: true

defaults:
  -
    scope:
      path: "_works/*/*.md"
      type: "works"
    values:
      permalink: ":collection/:name/"
      layout: "page"
  -
    scope:
      path: "_pages/*"
      type: "pages"
    values:
      permalink: ":name"
      layout: "page"
