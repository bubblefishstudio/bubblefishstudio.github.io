title: BubbleFish Studio
tagline: Exploring Beauty in Sounds
description: >-
  A creative sound-art studio of two people based in Milano, Italy and Hangzhou, China.
  Site-specific sound art installations and computational music projects.
url: https://bubblefish.studio
baseurl: ""
email: info@bubblefish.studio
lang: en
twitter:
  username: bubblefishmusic

markdown: kramdown
kramdown:
  input: GFM
sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  works:
    output: true
    permalink: /works/:name/
  insights:
    output: true
    permalink: /insights/:name/
  redirects:
    output: true

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/video/hero-poster.webp
  - scope:
      type: works
    values:
      layout: project
  - scope:
      type: insights
    values:
      layout: post
  - scope:
      type: redirects
    values:
      layout: redirect
      sitemap: false

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - .bundle
  - .github
  - .vscode
  - .cursor
  - .DS_Store

include:
  - CNAME

work_categories:
  - id: animations
    label: Animations
  - id: short-film
    label: Short film
  - id: exhibitions
    label: Exhibitions
  - id: computational
    label: Computational
